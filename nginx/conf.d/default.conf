#-------------------------------------------------------------------
# 1. Host virtual: portal.empresa.local (servido directamente por Nginx)
#-------------------------------------------------------------------
server {
    listen 80;
    server_name portal.empresa.local;

    # Hardening perimetral básico (OWASP A05: Security Misconfiguration)
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Segregación de logs por host virtual
    access_log /var/log/nginx/portal_access.log;
    error_log  /var/log/nginx/portal_error.log warn;
}

#-------------------------------------------------------------------
# 2. Host virtual: app-gestion.empresa.local (proxy inverso hacia Apache)
#-------------------------------------------------------------------
server {
    listen 80;
    server_name app-gestion.empresa.local;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # Resolución interna mediante el DNS de Docker (nombre del servicio)
        proxy_pass http://apache-app:80;

        # Cabeceras de trazabilidad: preservan la IP del cliente real
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nginx sustituye por defecto la cabecera Server del backend por la suya.
        # Se deja pasar la de Apache (sin versión, ver ServerTokens Prod)
        # para poder comprobar qué servidor responde.
        proxy_pass_header Server;

        # Mitigación de ataques de denegación de servicio lentos (Slowloris)
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Segregación de logs para la aplicación de backend
    access_log /var/log/nginx/app_gestion_access.log;
    error_log  /var/log/nginx/app_gestion_error.log warn;
}
