# Se carga con "httpd-foreground -c Include conf/extra/vhost.conf"
# (ver docker-compose.yml), después de httpd.conf.

ServerName localhost

# Hardening: oculta versión y sistema operativo en la cabecera Server
ServerTokens Prod
ServerSignature Off

# IP real del cliente: Apache solo ve la IP del contenedor Nginx,
# así que se lee la cabecera X-Forwarded-For. Solo se confía en ella
# si la petición llega desde la red interna de Docker.
LoadModule remoteip_module modules/mod_remoteip.so
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12

# %a    = IP del cliente (ya corregida por mod_remoteip)
# %{c}a = IP de la conexión directa (el contenedor Nginx)
LogFormat "%a %{c}a %l %u %t \"%r\" %>s %b \"%{X-Forwarded-For}i\" \"%{X-Real-IP}i\"" realip

<VirtualHost *:80>
    ServerName app-gestion.empresa.local
    DocumentRoot "/usr/local/apache2/htdocs"

    # Los logs van al volumen ./apache/logs
    ErrorLog logs/error.log
    CustomLog logs/access.log realip

    # Endpoint restringido: solo con la cabecera X-Auth-Token: DAW2026
    <Location "/privado">
        Require expr "%{HTTP:X-Auth-Token} == 'DAW2026'"
    </Location>
</VirtualHost>
